<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අයදුම්පත සාර්ථකයි - ශ්‍රී ලංකා දුම්රිය දෙපාර්තමේන්තුව</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .success-icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 20px;
        }
        h2 {
            color: #0f4c81;
            margin-bottom: 15px;
        }
        p {
            color: #333;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .app-number {
            font-weight: bold;
            color: #007bff;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 25px;
            font-size: 18px;
        }
        .btn-home {
            background-color: #0f4c81;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .btn-home:hover {
            background-color: #0d3d6b;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">&#10004;</div>
        <h2>අයදුම්පත සාර්ථකව යොමු කරන ලදී!</h2>
        <p>ශ්‍රී ලංකා දුම්රිය දෙපාර්තමේන්තුවේ නිවාස අයදුම්පත සාර්ථකව භාර ගන්නා ලදී. ඔබගේ යොමු අංකය පහතින් දැක්වේ:</p>
        
        <div>
            <!-- නව ආකෘතිය පමණක් ඉතිරි කර ඇත -->
            <span id="display-app-no" class="app-number">SLR/AOT/2026/0001</span>
        </div>

        <div>
            <a href="applicant_dashboard.html" class="btn-home">මුල් පිටුවට යන්න</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const appNo = urlParams.get('appNo');
        if (appNo) {
            document.getElementById('display-app-no').textContent = appNo;
        }
    </script>
</body>
</html>
